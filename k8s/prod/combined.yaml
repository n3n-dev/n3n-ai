apiVersion: apps/v1
kind: Deployment
metadata:
  name: n3n-ai
  namespace: n3n-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: n3n-ai
  template:
    metadata:
      labels:
        app: n3n-ai
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: n3n-ai
          image: ghcr.io/n3n-dev/n3n-ai:latest
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: n3n-ai-svc
  namespace: n3n-ai
spec:
  selector:
    app: n3n-ai
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: n3n-ai-ingress
  namespace: n3n-ai
spec:
  ingressClassName: traefik
  rules:
    # 스테이징/검증용 내부 호스트 (와일드카드 *.prod.nthreen.com → prod 클러스터)
    # n3n.ai DNS cutover 전까지 이 호스트로 검증한다.
    - host: n3n-ai-prod.prod.nthreen.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: n3n-ai-svc
                port:
                  number: 80
    - host: n3n.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: n3n-ai-svc
                port:
                  number: 80
    - host: www.n3n.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: n3n-ai-svc
                port:
                  number: 80
