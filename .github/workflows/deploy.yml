name: Build and Deploy to K8s

on:
  push:
    branches: [draft1, main]

env:
  IMAGE_NAME: ghcr.io/n3n-dev/n3nai
  NAMESPACE: homepage-n3n-ai
  APP_NAME: n3nai

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: arc-runner-set
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.28.0"

      - name: Resolve target env
        id: target
        run: |
          if [ "${{ github.ref }}" = "refs/heads/draft1" ]; then
            echo "env=d2" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "env=prod" >> "$GITHUB_OUTPUT"
          else
            echo "Unknown ref: ${{ github.ref }}" >&2
            exit 1
          fi

      - name: Write kubeconfig
        env:
          KUBECONFIG_D2: ${{ secrets.KUBECONFIG_D2 }}
          KUBECONFIG_PROD: ${{ secrets.KUBECONFIG_PROD }}
          CONTEXT: ${{ steps.target.outputs.env }}
        run: |
          mkdir -p "$RUNNER_TEMP/.kube"
          if [ "$CONTEXT" = "d2" ]; then
            echo "$KUBECONFIG_D2" | base64 -d > "$RUNNER_TEMP/.kube/config"
          elif [ "$CONTEXT" = "prod" ]; then
            echo "$KUBECONFIG_PROD" | base64 -d > "$RUNNER_TEMP/.kube/config"
          else
            echo "Unknown CONTEXT: $CONTEXT" >&2; exit 1
          fi
          chmod 600 "$RUNNER_TEMP/.kube/config"

      - name: Deploy
        env:
          KUBECONFIG: ${{ runner.temp }}/.kube/config
          CONTEXT: ${{ steps.target.outputs.env }}
        run: |
          kubectl --context "$CONTEXT" -n $NAMESPACE apply -f k8s/${{ steps.target.outputs.env }}/combined.yaml
          kubectl --context "$CONTEXT" -n $NAMESPACE set image \
            deployment/$APP_NAME \
            $APP_NAME=$IMAGE_NAME:sha-${{ github.sha }}
          kubectl --context "$CONTEXT" -n $NAMESPACE rollout status \
            deployment/$APP_NAME --timeout=120s

      - name: Rollback on failure
        if: failure()
        env:
          KUBECONFIG: ${{ runner.temp }}/.kube/config
          CONTEXT: ${{ steps.target.outputs.env }}
        run: |
          kubectl --context "$CONTEXT" -n $NAMESPACE rollout undo deployment/$APP_NAME || true
          exit 1
